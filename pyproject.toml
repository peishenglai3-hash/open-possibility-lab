[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-possibility-lab"
version = "0.3.0"
description = "A provenance-first, dissent-preserving workspace for research collaboration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Lai Peisheng" }]
keywords = ["provenance", "research collaboration", "human-AI interaction", "epistemic humility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pydantic>=2.13,<3",
  "typer>=0.27,<1",
  "streamlit>=1.64,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.6"]

[project.scripts]
open-possibility = "team_soul.cli:app"

[project.urls]
Homepage = "https://github.com/peishenglai3-hash/open-possibility-lab"
Repository = "https://github.com/peishenglai3-hash/open-possibility-lab"
Issues = "https://github.com/peishenglai3-hash/open-possibility-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
